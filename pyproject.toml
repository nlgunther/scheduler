[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-scheduler"
version = "2.0.0"
description = "A hybrid SQLite/JSON task scheduler."
authors = [
  { name = "Nick Gunther", email = "nick@example.com" },
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
# Point 'schd' to the NEW package entry point
schd = "scheduler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["scheduler", "scheduler.services", "scheduler.storage"]
